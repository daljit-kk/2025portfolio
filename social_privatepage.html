<!DOCTYPE html>
<!--
  HOW TO USE
  1. Save this file as wiser.html in the main folder of daljitkaurdesign.com and upload it.
  2. Do not link to it from your menu (it is unlisted: search engines are told to skip it).
  3. To change the mantras, edit the block marked "EDIT YOUR MANTRAS HERE" near the bottom.
  4. Keep the file name the same forever so the QR code on your poster keeps working.
  Save as UTF-8. Preview in a browser (or Live View), not Design view.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f1ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%A1%3C/text%3E%3C/svg%3E">
<title>1% wiser · Daljit Kaur's (unfinished) manifesto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f1ea;--fg:#1a1a1a;--muted:#6a675f;--line:#d9d4c8;--accent:#d91b5c;--card:#fbf9f4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#121212;--fg:#f4f1ea;--muted:#a8a498;--line:#2e2e2b;--accent:#ff5c8a;--card:#1a1a19}
}
:root[data-theme="dark"]{--bg:#121212;--fg:#f4f1ea;--muted:#a8a498;--line:#2e2e2b;--accent:#ff5c8a;--card:#1a1a19}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;display:flex;flex-direction:column}
.wrap{width:100%;max-width:640px;margin:0 auto;padding:22px 20px 34px;display:flex;flex-direction:column;flex:1}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:.78rem;color:var(--muted);letter-spacing:.02em}
.top b{color:var(--fg);font-weight:600}
.top a{color:var(--fg)}
.meter{margin-top:14px}
.meter .lab{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-size:1.05rem;letter-spacing:.02em}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:10%;background:var(--accent);transition:width .35s ease}
.card{flex:1;display:flex;flex-direction:column;justify-content:center;padding:34px 0 18px}
.num{font-family:Anton,Impact,"Arial Narrow",sans-serif;color:var(--accent);font-size:1.3rem;letter-spacing:.04em}
.head{font-family:Anton,Impact,"Arial Narrow Bold","Arial Narrow",sans-serif;font-weight:400;font-size:clamp(2.3rem,11vw,4.4rem);line-height:1.04;margin:.2em 0 0;letter-spacing:-.005em;word-break:break-word}
.head.long{font-size:clamp(1.6rem,7vw,2.5rem);line-height:1.1}
.rest{margin:18px 0 0;font-size:1.05rem;max-width:34em}
button.go{margin-top:30px;align-self:flex-start;font:inherit;font-weight:600;font-size:1.05rem;border:0;border-radius:999px;background:var(--fg);color:var(--bg);padding:14px 26px;cursor:pointer}
button.go:active{transform:scale(.98)}
.note{margin-top:14px;color:var(--muted);font-size:.9rem;min-height:1.4em}
details{margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:600}
ol{margin:14px 0 0;padding:0;list-style:none}
ol li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.95rem}
ol li b{font-family:Anton,Impact,sans-serif;font-weight:400;color:var(--accent);min-width:2.1em}
footer{margin-top:28px;font-size:.82rem;color:var(--muted)}
footer a{color:var(--fg)}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span><b>daljit kaur's (unfinished) manifesto</b><br>My thoughts on design, creativity, and life. · <a href="https://daljitkaurdesign.com">daljitkaurdesign.com</a></span></div>

  <div class="meter" aria-live="polite">
    <div class="lab" id="lab">1% wiser</div>
    <div class="bar"><i id="fill"></i></div>
  </div>

  <div class="card" aria-live="polite">
    <div class="num" id="num"></div>
    <h1 class="head" id="head"></h1>
    <p class="rest" id="rest"></p>
    <button class="go" id="go" type="button">Another 1% →</button>
    <div class="note" id="note"></div>
  </div>

  <details>
    <summary>Read the whole manifesto</summary>
    <ol id="all"></ol>
  </details>

</div>

<script>
(function(){
  // ===== EDIT YOUR MANTRAS HERE =====
  // n = number, h = the big line, r = smaller follow-up (use "" for none)
  var items=[
    {n:"01",h:"KISS (Keep it simple, silly).",r:""},
    {n:"02",h:"If something doesn\u2019t need to be there, you\u2019ll benefit from removing it.",r:"This could apply to house furniture, decorative lines on business cards\u2014pretty much anything!"},
    {n:"03",h:"If you have access to them, don\u2019t pass up a chance to test your designs with your target audience.",r:""},
    {n:"04",h:"Strive for multiple iterations > perfection.",r:"Perfection really does not exist, but your project will get better and better with every iteration."},
    {n:"05",h:"Fail often, fail fast, and fail forward.",r:""},
    {n:"06",h:"Shift your focus from perfecting the design principles to evoking an emotional response.",r:"It\u2019s a lot harder to get an emotional reaction out of someone compared to getting the layout, typography, and hierarchy \u201Cperfect,\u201D but it\u2019s worth it."},
    {n:"07",h:"If you\u2019re intimidated by someone, their talent, their accomplishments, don\u2019t run away from them.",r:"Seek them out. Introduce yourself, work on a project with them, and ask for their feedback. Learn from them."},
    {n:"08",h:"Communication of the idea is just as important as the idea itself\u2014maybe even more important!",r:""},
    {n:"09",h:"Build your confidence by acquiring the skill(s) you told yourself you couldn\u2019t do when you were a kid.",r:"So go learn how to cartwheel, ride that bike, or whatever you\u2019ve always told yourself \u201Cyou just don\u2019t know how to do,\u201D and watch your confidence skyrocket!"},
    {n:"10",h:"If it\u2019s not a hell yes, it\u2019s a no.",r:""}
  ];
  // ===== END OF MANTRAS =====
  var KEY="wiser-seen-v1";
  var seen=[];
  try{ seen=JSON.parse(localStorage.getItem(KEY)||"[]")||[]; }catch(e){ seen=[]; }
  var cur=-1, count=0;
  var $=function(id){return document.getElementById(id);};

  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(seen)); }catch(e){} }
  function pick(){
    var pool=[];
    for(var i=0;i<items.length;i++){ if(seen.indexOf(i)===-1) pool.push(i); }
    if(!pool.length){
      seen=[];
      for(var j=0;j<items.length;j++){ if(j!==cur) pool.push(j); }
    }
    return pool[Math.floor(Math.random()*pool.length)];
  }
  function show(){
    cur=pick(); seen.push(cur); save();
    count=Math.min(count+1,10);
    var it=items[cur];
    $("num").textContent=it.n+".";
    var h=$("head"); h.textContent=it.h;
    h.className="head"+(it.h.length>70?" long":"");
    $("rest").textContent=it.r;
    $("rest").style.display=it.r?"block":"none";
    $("lab").textContent=count+"% wiser";
    $("fill").style.width=(count*10)+"%";
    $("note").textContent= count>=10 ? "That\u2019s ten. The manifesto is unfinished, so check back." : (count===1 ? "Results may vary." : "");
  }
  var list=$("all");
  items.forEach(function(it){
    var li=document.createElement("li");
    var b=document.createElement("b"); b.textContent=it.n+".";
    var s=document.createElement("span"); s.textContent=it.h+(it.r?" "+it.r:"");
    li.appendChild(b); li.appendChild(s); list.appendChild(li);
  });
  $("go").addEventListener("click",show);
  show();
})();
</script>
</body>
</html>
